module: middleware/ros2/perception/face_detection

tests:
  - name: face-detection-functional
    description: Verify face_detection config errors, lazy_load startup, and boxes topic (requires SDK staging build).
    category: functional
    scopes: [pr]
    timeout_s: 300
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash face_detection/tests/test_functional.sh

  - name: face-detection-invalid-input
    description: Reject invalid yaml, missing config, missing model, and out-of-range score_threshold.
    category: functional
    scopes: [pr]
    timeout_s: 180
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash face_detection/tests/test_invalid_input.sh

  - name: face-detection-performance
    description: Measure init time and first inference output latency with real model (thresholds 5s / 8s).
    category: performance
    scopes: [scheduled]
    timeout_s: 420
    artifacts:
      - perception_perf_face_detection.txt
    workdir: sdk
    command: |
      cd middleware/ros2/perception
      bash face_detection/tests/test_performance.sh
